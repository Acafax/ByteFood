version: '3.8'

services:
  watchtower:
    image: containrrr/watchtower:latest
    command:
      - "--label-enable"
      - "--interval"
      - "30"
      - "--cleanup"
    environment:
      - REPO_USER=${GIHUB_USERNAME}
      - REPO_PASS=${VPS_WatchTower_Read}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  reverse-proxy:
    image: traefik:latest
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ghcr.io/acafax/bytefood:latest
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend.rule=Host(`bytefood.pl`) && PathPrefix(`/api`)"
        - "traefik.http.routers.backend.tls.certresolver=myresolver"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.services.backend.loadbalancer.server.port=8080"
        - "com.centurylinklabs.watchtower.enable=true"

    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REGISTRATION_ENABLED=false
      - CORS_ALLOWED_ORIGINS=https://bytefood.pl
      - TRACING_SAMPLING_PROBABILITY=0.1
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 200s
        order: start-first
        failure_action: rollback

    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-db:
    image: postgres:16

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgres/data
      #- ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/acafax/bytefood-frontend:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`bytefood.pl`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
    build: ./frontend
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/apache/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=1GB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:latest
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki


  jaeger:
    image: jaegertracing/all-in-one:latest
    user: root
    environment:
      - COLLECTOR_OTLP_ENABLED=true # required to get data from Spring Boot (OpenTelemetry)
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.middlewares=grafana-slash"

      - "traefik.http.routers.grafana.rule=Host(`bytefood.pl`) && PathPrefix(`/monitor`)"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

      - "traefik.http.middlewares.grafana-slash.redirectregex.regex=^(https?://[^/]+)/monitor$$"
      - "traefik.http.middlewares.grafana-slash.redirectregex.replacement=$${1}/monitor/"
    image: grafana/grafana:latest
    environment:
      - GF_SERVER_DOMAIN=bytefood.pl
      - GF_SERVER_ROOT_URL=https://bytefood.pl/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
      - loki
      - jaeger
    volumes:
      - grafana-data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-dashboards:/etc/grafana/dashboards


volumes:
  kafka_data:
  letsencrypt:
  postgres_data:
  grafana-data:
  loki-data:
  jaeger-data:
  prometheus-data:

